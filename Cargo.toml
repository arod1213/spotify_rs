[package]
name = "spotify_rs"
version = "0.1.8"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
futures = "0.3.32"
reqwest = {version = "0.13.3", features=["json", "query", "form"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = {version = "0.4.44", features=["serde"]}
tokio = { version = "1.52.1", features = ["full"] }
schemars = "1.2.1"
